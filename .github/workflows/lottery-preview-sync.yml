name: Lottery snapshot sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lottery-preview-sync.yml'
  schedule:
    # GitHub schedules use UTC; these runs cover 20:48–23:28 Asia/Shanghai.
    - cron: '48,53,58 12 * * *'
    - cron: '3-58/5 13,14 * * *'
    - cron: '3-28/5 15 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lottery-snapshot-sync
  cancel-in-progress: false

jobs:
  collect-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Collect latest draw data outside Cloudflare
        run: node scripts/collect-lottery-latest.mjs > "$RUNNER_TEMP/lottery-latest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lottery-latest
          path: ${{ runner.temp }}/lottery-latest.json
          retention-days: 1

  sync-preview:
    needs: collect-latest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lottery-latest
          path: ${{ runner.temp }}
      - name: Request a GitHub OIDC token and sync the Preview snapshot
        env:
          SYNC_WORKER_URL: https://caiyan-lottery-sync-preview.cxu96175.workers.dev/sync
        run: |
          set -eu
          token_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=caiyan-lottery-sync-preview")"
          oidc_token="$(printf '%s' "$token_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          sync_response="$(curl --fail --silent --show-error --retry 2 --max-time 45 \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${RUNNER_TEMP}/lottery-latest.json" \
            "$SYNC_WORKER_URL")"
          printf '%s' "$sync_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); results=data.get("results", []); print(json.dumps(data, ensure_ascii=False)); games={item.get("game") for item in results}; states=[item.get("state") for item in results]; bad={"error", "missing-or-invalid-submission", "empty", "upstream-not-advanced", "waiting-for-confirmation"}; sys.exit(0 if data.get("ok") and len(games)==8 and not bad.intersection(states) else 1)'

  sync-production:
    needs: collect-latest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lottery-latest
          path: ${{ runner.temp }}
      - name: Request a GitHub OIDC token and sync the Production snapshot
        env:
          SYNC_WORKER_URL: https://caiyan-lottery-sync-production.cxu96175.workers.dev/sync
        run: |
          set -eu
          token_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=caiyan-lottery-sync-production")"
          oidc_token="$(printf '%s' "$token_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          sync_response="$(curl --fail --silent --show-error --retry 2 --max-time 45 \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${RUNNER_TEMP}/lottery-latest.json" \
            "$SYNC_WORKER_URL")"
          printf '%s' "$sync_response" | python3 -c 'import json,sys; data=json.load(sys.stdin); results=data.get("results", []); print(json.dumps(data, ensure_ascii=False)); games={item.get("game") for item in results}; states=[item.get("state") for item in results]; bad={"error", "missing-or-invalid-submission", "empty", "upstream-not-advanced", "waiting-for-confirmation"}; sys.exit(0 if data.get("ok") and len(games)==8 and not bad.intersection(states) else 1)'
